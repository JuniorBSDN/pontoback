<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PontoBack | Terminal de Ponto Corporativo</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #0f172a; --card: #1e293b; --success: #22c55e; --danger: #ef4444; --info: #3b82f6; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; transition: background 0.3s ease; }
        
        .card { background: var(--card); padding: 30px; border-radius: 20px; width: 90%; max-width: 480px; text-align: center; box-shadow: 0 20px 35px rgba(0,0,0,0.4); border: 1px solid #334155; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: var(--primary); }
        
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: all 0.2s; margin-top: 10px; }
        button:hover { opacity: 0.95; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        
        #reader-container { position: relative; width: 100%; height: 320px; background: #000; border-radius: 14px; overflow: hidden; margin-top: 20px; border: 2px solid #475569; display: flex; align-items: center; justify-content: center; }
        #video, #reader { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        #reader video { object-fit: cover; }
        
        /* Animação e Guia de Rosto Fluida */
        .overlay-guia { position: absolute; border: 2px dashed rgba(255, 255, 255, 0.7); width: 180px; height: 230px; border-radius: 50%; pointer-events: none; z-index: 10; animation: pulseGuia 2s infinite ease-in-out; }
        @keyframes pulseGuia { 0% { border-color: rgba(255, 255, 255, 0.4); } 50% { border-color: rgba(79, 70, 229, 0.9); } 100% { border-color: rgba(255, 255, 255, 0.4); } }
        
        .toggle-group { display: flex; gap: 10px; margin-top: 15px; background: #0f172a; padding: 4px; border-radius: 10px; border: 1px solid #334155; }
        .btn-toggle { flex: 1; background: transparent; color: #94a3b8; border: none; padding: 10px; border-radius: 8px; font-size: 0.9rem; margin: 0; }
        .btn-toggle.active { background: var(--primary); color: white; font-weight: bold; }

        /* Feedback Visual Dinâmico na Tela Inteira */
        #feedback {
            display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.92);
            z-index: 9999; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; animation: fadeIn 0.2s ease-out;
        }
        #feedback-icon { font-size: 4rem; margin-bottom: 15px; }
        #feedback-text { font-size: 1.8rem; font-weight: bold; max-width: 600px; line-height: 1.4; white-space: pre-wrap; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .info-text { margin-top: 15px; color: #94a3b8; font-size: 0.9rem; }
        #nome-unidade { color: #818cf8; font-weight: bold; font-size: 1.2rem; margin-bottom: 5px; }
        #reader__dashboard_section_csr, #reader__dashboard_section_swaplink { display: none !important; }
    </style>
</head>
<body>

    <!-- TELA DE FEEDBACK CORPORATIVA (IMPACTO VISUAL SÓLIDO) -->
    <div id="feedback">
        <div id="feedback-icon">✔</div>
        <div id="feedback-text">Sucesso!</div>
    </div>

    <!-- TELA DE ATIVAÇÃO DO DISPOSITIVO -->
    <div id="login-area" class="card">
        <h2>Ativação do Terminal</h2>
        <p class="info-text">Insira as credenciais fornecidas pelo gestor</p>
        <input type="text" id="t-cnpj" placeholder="CNPJ da Unidade">
        <input type="password" id="t-senha" placeholder="Senha de Acesso">
        <button onclick="ativarTablet()">Ativar Terminal</button>
    </div>

    <!-- TELA DE REGISTRO DE PONTO -->
    <div id="ponto-area" class="card" style="display: none;">
        <div id="nome-unidade">Unidade</div>
        <p class="info-text" style="margin-top:0">Sistema de Frequência Inteligente</p>
        
        <div class="toggle-group">
            <button id="btn-modo-face" class="btn-toggle active" onclick="alternarModo('FACE')">📷 Reconhecimento Facial</button>
            <button id="btn-modo-qr" class="btn-toggle" onclick="alternarModo('QR')">🔳 Crachá (QR Code)</button>
        </div>

        <p id="instrucao-texto" class="info-text">Centralize o rosto no círculo e clique abaixo</p>

        <div id="reader-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <div id="guia-face" class="overlay-guia"></div>
            <div id="reader" style="display: none;"></div>
        </div>

        <button id="btn-captura-face" onclick="baterPontoFacial()">Registrar Ponto por Face</button>
        <button onclick="sair()" style="background: #334155; padding: 10px; margin-top: 15px; font-size: 0.85rem;">Desativar / Trocar Unidade</button>
    </div>

    <script>
        const API_URL = "https://pontoback-tau.vercel.app/api";
        let config = JSON.parse(localStorage.getItem("config_tablet"));
        let machineId = localStorage.getItem("machine_id") || "TAB-" + Math.random().toString(36).substr(2, 6).toUpperCase();
        
        let streamCamera = null;
        let qrScanner = null;
        let modoAtual = 'FACE';

        if (!localStorage.getItem("machine_id")) localStorage.setItem("machine_id", machineId);

        function iniciar() {
            if (config) {
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('ponto-area').style.display = 'block';
                document.getElementById('nome-unidade').innerText = config.nome;
                iniciarModoFace();
            }
        }

        async function ativarTablet() {
            const cnpj = document.getElementById('t-cnpj').value.replace(/\D/g, '');
            const senha = document.getElementById('t-senha').value;
            if(!cnpj || !senha) return alert("Preencha todos os campos.");

            try {
                const res = await fetch(`${API_URL}/clientes/login-tablet`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ cnpj, senha })
                });

                if (res.ok) {
                    const dados = await res.json();
                    config = { id: dados.id, nome: dados.nome };
                    localStorage.setItem("config_tablet", JSON.stringify(config));

                    await fetch(`${API_URL}/clientes/ativar-dispositivo`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            cliente_id: config.id,
                            machine_id: machineId,
                            modelo: "Terminal Web Corporativo"
                        })
                    });
                    location.reload();
                } else {
                    mostrarFeedback("Acesso Negado", "CNPJ ou senha inválidos.", "erro");
                }
            } catch (e) {
                mostrarFeedback("Erro de Conexão", "Não foi possível contatar o servidor.", "erro");
            }
        }

        function alternarModo(novoModo) {
            if (modoAtual === novoModo) return;
            modoAtual = novoModo;

            document.getElementById('btn-modo-face').classList.toggle('active', novoModo === 'FACE');
            document.getElementById('btn-modo-qr').classList.toggle('active', novoModo === 'QR');

            if (novoModo === 'FACE') {
                pararModoQR();
                iniciarModoFace();
            } else {
                pararModoFace();
                iniciarModoQR();
            }
        }

        async function iniciarModoFace() {
            document.getElementById('video').style.display = 'block';
            document.getElementById('guia-face').style.display = 'block';
            document.getElementById('btn-captura-face').style.display = 'block';
            document.getElementById('instrucao-texto').innerText = "Centralize o rosto no círculo e clique abaixo";

            try {
                streamCamera = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: false 
                });
                document.getElementById('video').srcObject = streamCamera;
            } catch (err) {
                mostrarFeedback("Erro de Câmera", "Permissão negada ou hardware indisponível.", "erro");
            }
        }

        function pararModoFace() {
            if (streamCamera) {
                streamCamera.getTracks().forEach(track => track.stop());
                streamCamera = null;
            }
            document.getElementById('video').style.display = 'none';
            document.getElementById('guia-face').style.display = 'none';
            document.getElementById('btn-captura-face').style.display = 'none';
        }

        async function baterPontoFacial() {
            if (window.processandoPonto) return;
            
            const video = document.getElementById('video');
            if (!video.videoWidth || !video.videoHeight) {
                mostrarFeedback("Aguarde", "A câmera está inicializando...", "erro");
                return;
            }

            window.processandoPonto = true;
            const canvas = document.getElementById('canvas');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imagemBase64 = canvas.toDataURL('image/jpeg', 0.85);
            mostrarFeedback("Analisando...", "Processando biometria facial...", "info");

            try {
                const res = await fetch(`${API_URL}/ponto/facial`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        id_cliente: config.id,
                        machine_id: machineId,
                        imagem: imagemBase64,
                        timestamp_local: new Date().toISOString()
                    })
                });
                processarRespostaAPI(res);
            } catch (e) {
                mostrarFeedback("Falha de Rede", "Verifique sua conexão com a internet.", "erro");
                setTimeout(() => { window.processandoPonto = false; }, 4000);
            }
        }

        function iniciarModoQR() {
            document.getElementById('reader').style.display = 'block';
            document.getElementById('instrucao-texto').innerText = "Aponte o crachá com QR Code para a lente";
            
            qrScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 240, height: 240 } });
            
            qrScanner.render(async (cpfLido) => {
                if (window.processandoPonto) return;
                window.processandoPonto = true;

                const cpfLimpo = cpfLido.replace(/\D/g, "");
                mostrarFeedback("Lendo Crachá...", "Processando...", "info");
                
                try {
                    const res = await fetch(`${API_URL}/ponto/registrar`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            id_cliente: config.id,
                            id_funcionario: cpfLimpo,
                            machine_id: machineId,
                            timestamp_local: new Date().toISOString(),
                            geo: "0,0"
                        })
                    });
                    processarRespostaAPI(res);
                } catch (e) {
                    mostrarFeedback("Falha de Rede", "Erro ao conectar com servidor.", "erro");
                    setTimeout(() => { window.processandoPonto = false; }, 4000);
                }
            });
        }

        function pararModoQR() {
            if (qrScanner) {
                qrScanner.clear().catch(e => console.error(e));
                qrScanner = null;
            }
            document.getElementById('reader').style.display = 'none';
        }

        async function processarRespostaAPI(res) {
            const data = await res.json();
            if (res.ok) {
                let msg = data.tipo === "ENTRADA"
                    ? `BOM TRABALHO!\nEntrada Registrada\n${data.funcionario || data.nome_funcionario || ''}`
                    : `ATÉ LOGO!\nSaída Registrada\n${data.horas || data.horas_trabalhadas || 0}h trabalhadas`;
                
                mostrarFeedback("✔", msg, "sucesso");
            } else {
                mostrarFeedback("✖", data.erro || "Rosto não reconhecido", "erro");
            }
            
            setTimeout(() => { window.processandoPonto = false; }, 4500);
        }

        function mostrarFeedback(icone, mensagem, tipo) {
            const fb = document.getElementById('feedback');
            const iconEl = document.getElementById('feedback-icon');
            const textEl = document.getElementById('feedback-text');
            
            iconEl.innerText = icone;
            textEl.innerText = mensagem;

            if (tipo === "sucesso") {
                iconEl.style.color = "var(--success)";
            } else if (tipo === "info") {
                iconEl.style.color = "var(--info)";
            } else {
                iconEl.style.color = "var(--danger)";
            }

            fb.style.display = 'flex';
            setTimeout(() => { fb.style.display = 'none'; }, 4000);
        }

        function sair() {
            if(confirm("Deseja desativar este terminal?")) {
                pararModoFace();
                pararModoQR();
                localStorage.clear();
                location.reload();
            }
        }

        iniciar();
    </script>
</body>
</html>
